<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注文ステータス更新(入力) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 640px;">
        <h1 class="text-center mb-4">注文ステータス更新(入力)</h1>

        <form th:action="@{/admin/order/status/update/{id}(id=${order.id})}" method="post">
            <table class="table table-bordered">
                <tbody>
                <tr><th class="w-25">購入日時</th><td th:text="${#temporals.format(order.orderDateTime, 'yyyy年MM月dd日 HH:mm')}"></td></tr>
                <tr><th>顧客アカウント名</th><td th:text="${order.customerDisplayName}"></td></tr>
                <tr><th>注文ID</th><td th:text="${order.id}"></td></tr>
                <tr><th>合計金額</th><td th:text="${order.totalAmount} + '円'"></td></tr>
                <tr>
                    <th>現在のステータス</th>
                    <td>
                        <span th:text="${order.status.label}"></span>
                        <select name="orderStatus" class="form-select form-select-sm d-inline-block w-auto ms-2">
                            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}" th:selected="${s == order.status}"></option>
                        </select>
                        <button type="submit" class="btn btn-fs btn-sm ms-2">ステータス更新</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <h2 class="h6 text-center mt-4">注文商品</h2>
            <table class="table table-bordered">
                <thead><tr><th>商品名</th><th>価格</th><th>数量</th><th>小計</th></tr></thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.productName}"></td>
                    <td th:text="${item.price} + '円'"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${item.subTotal} + '円'"></td>
                </tr>
                </tbody>
            </table>

            <h2 class="h6 text-center mt-4">配送先情報</h2>
            <table class="table table-bordered">
                <tbody>
                <tr><th class="w-25">住所</th><td th:text="${order.shippingAddress}"></td></tr>
                <tr><th>電話番号</th><td th:text="${order.shippingPhone}"></td></tr>
                </tbody>
            </table>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/admin/order/search}" class="link-fs">購入履歴検索に戻る</a>
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
