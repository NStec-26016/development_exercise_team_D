<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>購入履歴検索 - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 900px;">
        <h1 class="text-center mb-4">購入履歴検索</h1>

        <form th:action="@{/admin/order/search}" method="get" class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <select name="orderDate" class="form-select w-auto">
                <option value="">選択してください</option>
                <option th:each="d : ${orderDates}" th:value="${d}" th:text="${d}" th:selected="${d == selectedOrderDate}"></option>
            </select>
            <select name="customerAccountName" class="form-select w-auto">
                <option value="">選択してください</option>
                <option th:each="c : ${customerAccountNames}" th:value="${c}" th:text="${c}" th:selected="${c == selectedCustomerAccountName}"></option>
            </select>
            <button type="submit" class="btn btn-fs">検索</button>
        </form>

        <h2 class="h5 text-center mb-3">購入履歴一覧</h2>

        <div class="alert alert-info text-center" th:if="${#lists.isEmpty(orders)}">
            該当する注文が見つかりませんでした
        </div>

        <table class="table table-bordered" th:unless="${#lists.isEmpty(orders)}">
            <thead>
            <tr>
                <th>購入日時</th>
                <th>顧客アカウント名(氏名)</th>
                <th>注文内容</th>
                <th>ステータス</th>
                <th>ステータス更新</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td class="align-middle" th:text="${#temporals.format(o.orderDateTime, 'yyyy年MM月dd日 HH:mm')}"></td>
                <td class="align-middle" th:text="${o.customerDisplayName}"></td>
                <td style="white-space: pre-line" th:text="${o.orderContentSummary}"></td>
                <td class="align-middle" th:text="${o.status.label}"></td>
                <td class="align-middle"><a th:href="@{/admin/order/status/update/{id}(id=${o.id})}" class="btn btn-fs btn-sm">更新</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
