<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>メニュー - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 640px;">
        <h1 class="text-center mb-4">メニュー</h1>
        <p class="text-center" th:if="${loggedIn}">ようこそ、<span th:text="${loginEmployeeName}">担当者名</span>さん</p>
        <div class="text-center">
            <img th:src="@{/images/Shop_Img1.jpeg}" alt="ようこそ" class="img-fluid rounded" style="max-height: 240px;">
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
