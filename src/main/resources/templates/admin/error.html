<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>エラー - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
        <h1 class="text-center mb-4">システムエラー</h1>
        <div class="alert alert-danger" th:text="${errorMessage} ?: 'システムエラーが発生しました。管理者に連絡してください。'"></div>
        <p th:if="${errorDetail}" class="text-muted small" th:text="${errorDetail}"></p>
        <div class="text-center mt-4">
            <a th:href="@{/admin}" class="link-fs">&raquo; メニュー画面に戻る</a>
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
