<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品削除(確認) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto text-center" style="max-width: 480px;">
        <h1 class="mb-4">商品削除(確認)</h1>

        <table class="table text-start">
            <tbody>
            <tr><th class="w-25">商品名</th><td th:text="${product.name}"></td></tr>
            <tr><th>単価</th><td th:text="${product.price} + '円'"></td></tr>
            <tr><th>在庫数</th><td th:text="${product.stock}"></td></tr>
            <tr><th>商品カテゴリ</th><td th:text="${product.categoryName}"></td></tr>
            </tbody>
        </table>
        <img th:src="@{${product.imagePath}}" th:alt="${product.name}" class="img-fluid mb-4" style="max-height: 180px;">

        <form th:action="@{/admin/product/delete/{id}(id=${product.id})}" method="post">
            <a th:href="@{/admin/product}" class="btn btn-link link-fs">キャンセル</a>
            <button type="submit" class="btn btn-fs-solid px-4">完了</button>
        </form>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
