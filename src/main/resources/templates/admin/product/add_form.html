<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新商品登録(入力) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
        <h1 class="text-center mb-4">新商品登録(入力)</h1>

        <ul class="alert alert-danger" th:if="${errorMessages}">
            <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>
        </ul>

        <form th:action="@{/admin/product/add}" method="post" enctype="multipart/form-data">
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">商品名</label>
                <div class="col-sm-8">
                    <input type="text" name="name" class="form-control" th:value="${form.name}" maxlength="20">
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">単価</label>
                <div class="col-sm-8">
                    <input type="text" name="price" class="form-control" th:value="${form.price}">
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">在庫数</label>
                <div class="col-sm-8">
                    <input type="text" name="stock" class="form-control" th:value="${form.stock}">
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">商品カテゴリ</label>
                <div class="col-sm-8">
                    <select name="categoryId" class="form-select">
                        <option value="">選択してください</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${form.categoryId != null and form.categoryId == cat.id}"></option>
                    </select>
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">画像</label>
                <div class="col-sm-8">
                    <input type="file" name="image" class="form-control">
                </div>
            </div>
            <div class="text-center mt-4">
                <a th:href="@{/admin/product}" class="btn btn-link link-fs">キャンセル</a>
                <button type="submit" class="btn btn-fs-solid px-4">完了</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
