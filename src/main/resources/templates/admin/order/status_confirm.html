<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注文ステータス更新(確認) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
        <h1 class="text-center mb-4">注文ステータス更新(確認)</h1>
        <p class="text-center">以下の注文のステータスを更新します。よろしいですか？</p>

        <table class="table">
            <tbody>
            <tr><th class="w-25">注文ID</th><td th:text="${form.orderId}"></td></tr>
            <tr><th>購入日時</th><td th:text="${form.orderDateDisplay}"></td></tr>
            <tr><th>顧客アカウント名</th><td th:text="${form.customerDisplayName}"></td></tr>
            <tr><th>現在のステータス</th><td th:text="${form.currentStatusLabel}"></td></tr>
            <tr><th>新しいステータス</th><td th:text="${form.newStatusLabel}"></td></tr>
            </tbody>
        </table>

        <form th:action="@{/admin/order/status/update/confirm}" method="post" class="text-center">
            <button type="submit" name="action" value="confirm" class="btn btn-fs-solid px-4">確定する</button>
            <button type="submit" name="action" value="back" class="btn btn-fs px-4">戻る</button>
        </form>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
