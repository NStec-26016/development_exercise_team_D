<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント登録(確認) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
            <h1 class="text-center mb-4">アカウント登録(確認)</h1>

            <table class="table table-borderless">
                <tbody>
                    <tr>
                        <th class="w-25">社員名</th>
                        <td th:text="${form.employeeName}"></td>
                    </tr>
                    <tr>
                        <th>アカウント名</th>
                        <td th:text="${form.accountName}"></td>
                    </tr>
                    <tr>
                        <th>パスワード</th>
                        <td>*******</td>
                    </tr>
                </tbody>
            </table>

            <form th:action="@{/admin/account/confirm}" method="post">
                <div class="text-center mt-4">
                    <a th:href="@{/admin}" class="btn btn-link link-fs">キャンセル</a>
                    <button type="submit" name="action" value="back" class="btn btn-fs px-4">戻る</button>
                    <button type="submit" name="action" value="register" class="btn btn-fs-solid px-4">登録</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
