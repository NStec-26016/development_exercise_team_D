<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント登録(入力) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
            <h1 class="text-center mb-4">アカウント登録(入力)</h1>

            <ul class="alert alert-danger" th:if="${errorMessages}">
                <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>
            </ul>

            <form th:action="@{/admin/account/form}" method="post">
                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">社員名</label>
                    <div class="col-sm-8">
                        <select name="employeeId" class="form-select">
                            <option value="">選択してください</option>
                            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"
                                th:selected="${form.employeeId != null and form.employeeId == emp.id}"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">アカウント名</label>
                    <div class="col-sm-8">
                        <input type="text" name="accountName" class="form-control" th:value="${form.accountName}"
                            maxlength="20">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">パスワード</label>
                    <div class="col-sm-8">
                        <input type="password" name="password" class="form-control" maxlength="20">
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a th:href="@{/admin}" class="btn btn-link link-fs">キャンセル</a>
                    <button type="submit" class="btn btn-fs-solid px-4">完了</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
